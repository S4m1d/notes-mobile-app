[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.dependencies]
scarlet-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Slint's Android backend with one fix of ours; see vendor/README.md.
[patch.crates-io]
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
